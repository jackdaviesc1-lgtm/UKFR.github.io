<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Web Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 550px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .header { display: flex; align-items: center; gap: 15px; border-bottom: 2px solid #334155; padding-bottom: 20px; margin-bottom: 20px; }
        .header img { width: 60px; height: 60px; border-radius: 50%; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #334155; padding: 12px; border-radius: 8px; text-align: center; }
        .stat-card h4 { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; }
        .stat-card p { font-size: 1.3rem; font-weight: bold; color: #38bdf8; margin-top: 4px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #cbd5e1; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .status-msg { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; text-align: center; }
        .success { background: #15803d; color: white; display: block; }
        .error { background: #b91c1c; color: white; display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img id="botAvatar" src="https://via.placeholder.com/60" alt="Avatar">
        <div>
            <h2 id="botName">Loading...</h2>
            <p id="botStatus" style="color: #cbd5e1; font-size: 0.85rem;">Connecting to API...</p>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>Servers</h4>
            <p id="statGuilds">-</p>
        </div>
        <div class="stat-card">
            <h4>Users</h4>
            <p id="statUsers">-</p>
        </div>
        <div class="stat-card">
            <h4>Ping</h4>
            <p id="statPing">-</p>
        </div>
    </div>

    <div class="form-group">
        <label for="channelId">Target Channel ID</label>
        <input type="text" id="channelId" placeholder="123456789012345678">
    </div>

    <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" rows="3" placeholder="Type message..."></textarea>
    </div>

    <button onclick="sendMessage()">Send Announcement</button>
    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // Replace this with your hosted bot URL (e.g. "https://your-bot.onrender.com")
    const BACKEND_URL = "https://jackdaviesc1-lgtm.github.io/UKFR.github.io/";

    async function loadStats() {
        try {
            const res = await fetch(`${BACKEND_URL}/api/stats`);
            const data = await res.json();

            if (res.ok) {
                document.getElementById('botName').innerText = data.username;
                document.getElementById('botAvatar').src = data.avatar;
                document.getElementById('statGuilds').innerText = data.guilds;
                document.getElementById('statUsers').innerText = data.users;
                document.getElementById('statPing').innerText = `${data.ping} ms`;
                document.getElementById('botStatus').innerText = "● Online";
                document.getElementById('botStatus').style.color = "#4ade80";
            }
        } catch (err) {
            document.getElementById('botName').innerText = "Offline";
            document.getElementById('botStatus').innerText = "● Backend Unreachable";
            document.getElementById('botStatus').style.color = "#f87171";
        }
    }

    async function sendMessage() {
        const channelId = document.getElementById('channelId').value.trim();
        const message = document.getElementById('message').value.trim();
        const statusBox = document.getElementById('statusMsg');

        if (!channelId || !message) {
            statusBox.className = "status-msg error";
            statusBox.innerText = "Please fill in all fields.";
            return;
        }

        try {
            const res = await fetch(`${BACKEND_URL}/api/send-message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ channelId, message })
            });

            const data = await res.json();

            if (res.ok) {
                statusBox.className = "status-msg success";
                statusBox.innerText = data.message;
                document.getElementById('message').value = "";
            } else {
                statusBox.className = "status-msg error";
                statusBox.innerText = data.error;
            }
        } catch (err) {
            statusBox.className = "status-msg error";
            statusBox.innerText = "Error connecting to backend server.";
        }
    }

    loadStats();
</script>

</body>
</html>
